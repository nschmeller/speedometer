name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: |
          curl -sSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          shasum -a 256 xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
          rm xcodegen.zip
      - name: Generate project
        run: xcodegen generate
      - name: Select Xcode and simulator
        id: selection
        run: python3 .github/scripts/select_simulator.py >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          DEVELOPER_DIR: ${{ steps.selection.outputs.developer_dir }}
          DESTINATION: ${{ steps.selection.outputs.destination }}
        run: |
          xcodebuild test \
            -project Speedometer.xcodeproj \
            -scheme Speedometer \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
