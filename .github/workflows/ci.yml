name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select Xcode and simulator
        id: selection
        run: python3 .github/scripts/select_simulator.py >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          DEVELOPER_DIR: ${{ steps.selection.outputs.developer_dir }}
          DESTINATION: ${{ steps.selection.outputs.destination }}
        run: |
          xcodebuild test \
            -project Speedometer.xcodeproj \
            -scheme Speedometer \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
