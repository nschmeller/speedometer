name: Speedometer
options:
  bundleIdPrefix: com.nschmeller
  deploymentTarget:
    iOS: "17.0"
targets:
  Speedometer:
    type: application
    platform: iOS
    sources: [Speedometer]
    info:
      path: Speedometer/Info.plist
      properties:
        CFBundleDisplayName: Speedometer
        NSLocationWhenInUseUsageDescription: >-
          Your location is used only to calculate your current speed.
          It never leaves this device.
        UILaunchScreen: {}
  SpeedometerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpeedometerTests]
    dependencies:
      - target: Speedometer
schemes:
  Speedometer:
    build:
      targets:
        Speedometer: all
    test:
      targets: [SpeedometerTests]
